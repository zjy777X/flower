<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🌹</title>
  <style>
    :root {
      --bg: #fdf6f0;
      --card-bg: #ffffff;
      --text: #5a3e36;
      --accent: #c2414c;
      --accent-dark: #9b2c38;
      --gold: #c79a6e;
      --input-border: #e0c8b8;
      --error: #b91c1c;
      --shadow-card: 0 25px 55px rgba(100, 50, 40, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      background: linear-gradient(165deg, #fff5f0 0%, #fef0e8 30%, #fff7f5 70%, #fef5f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }
    .bg-particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #f9c5d1 0%, transparent 70%);
      animation: floatUp 14s infinite ease-in;
      opacity: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.3) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      45% { opacity: 0.3; }
      85% { opacity: 0.1; }
      100% { transform: translateY(-15vh) scale(1.7) rotate(360deg); opacity: 0; }
    }
    .bg-particle:nth-child(1) { left: 5%; width: 20px; height: 20px; animation-duration: 15s; }
    .bg-particle:nth-child(2) { left: 18%; width: 13px; height: 13px; animation-duration: 12s; animation-delay: 2s; }
    .bg-particle:nth-child(3) { left: 32%; width: 22px; height: 22px; animation-duration: 16s; animation-delay: 4s; }
    .bg-particle:nth-child(4) { left: 48%; width: 15px; height: 15px; animation-duration: 11s; animation-delay: 1s; }
    .bg-particle:nth-child(5) { left: 63%; width: 25px; height: 25px; animation-duration: 17s; animation-delay: 5s; }
    .bg-particle:nth-child(6) { left: 76%; width: 11px; height: 11px; animation-duration: 10s; animation-delay: 3s; }
    .bg-particle:nth-child(7) { left: 88%; width: 18px; height: 18px; animation-duration: 14s; animation-delay: 6s; }

    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card {
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: var(--shadow-card);
      padding: 40px 28px 34px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(190, 140, 120, 0.2);
    }
    .card::before {
      content: '';
      position: absolute;
      top: -70px; right: -70px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 180, 190, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -50px; left: -50px;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220, 170, 140, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .input-section {
      position: relative;
      z-index: 2;
      transition: all 0.5s ease;
    }
    .input-section.fade-out {
      opacity: 0;
      transform: translateY(-25px) scale(0.95);
      pointer-events: none;
    }
    .input-section h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    .input-section .subtitle {
      font-size: 0.95rem;
      color: #a08070;
      margin-bottom: 28px;
      font-weight: 400;
    }
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .input-wrapper input {
      flex: 1 1 200px;
      max-width: 320px;
      padding: 14px 20px;
      font-size: 1.05rem;
      border: 2px solid var(--input-border);
      border-radius: 50px;
      outline: none;
      background: #fefcfb;
      color: var(--text);
      transition: all 0.3s ease;
      text-align: center;
      font-family: inherit;
    }
    .input-wrapper input:focus {
      border-color: #e8a0b0;
      box-shadow: 0 0 0 5px rgba(220, 130, 150, 0.08);
      background: #fff;
    }
    .input-wrapper input.shake {
      animation: shake 0.55s ease;
      border-color: #e8a0a0;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15% { transform: translateX(-8px); }
      30% { transform: translateX(8px); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(2px); }
    }
    .btn-submit {
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #d4687c, #c2414c);
      color: #fff;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(180, 70, 80, 0.4);
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #dd7888, #d4525d);
      box-shadow: 0 8px 26px rgba(180, 70, 80, 0.55);
      transform: translateY(-2px);
    }
    .btn-submit:active { transform: translateY(0) scale(0.97); }

    .error-message {
      margin-top: 18px;
      font-size: 0.95rem;
      color: var(--error);
      font-weight: 500;
      min-height: 26px;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.35s ease;
    }
    .error-message.show {
      opacity: 1;
      transform: translateY(0);
    }
    .error-message .emoji {
      display: inline-block;
      animation: bounceEmoji 0.6s ease;
    }
    @keyframes bounceEmoji {
      0%,100% { transform: translateY(0); }
      30% { transform: translateY(-14px); }
      55% { transform: translateY(-4px); }
      75% { transform: translateY(-8px); }
    }

    /* 玫瑰花束区域 */
    .rose-section {
      position: relative;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeInUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .rose-section.active {
      display: flex;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rose-section canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(160, 90, 80, 0.12);
    }
    .blessing-text {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #c2414c, #e07a6a, #c2414c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .blessing-text.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .btn-back {
      margin-top: 4px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 2px solid #e0c8b8;
      border-radius: 50px;
      cursor: pointer;
      background: transparent;
      color: #8a6a5c;
      letter-spacing: 0.03em;
      transition: all 0.3s ease;
      font-family: inherit;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s, background 0.3s, border-color 0.3s;
    }
    .btn-back.show {
      opacity: 1;
      transform: translateY(0);
    }
    .btn-back:hover {
      background: #fef8f5;
      border-color: #cfa08a;
      color: #5a3e36;
    }

    @media (max-width: 500px) {
      .card { padding: 26px 16px 20px; border-radius: 24px; }
      .input-section h2 { font-size: 1.5rem; }
      .blessing-text { font-size: 1.6rem; }
      .btn-submit { padding: 12px 24px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
<div class="bg-particles">
  <div class="bg-particle"></div><div class="bg-particle"></div><div class="bg-particle"></div>
  <div class="bg-particle"></div><div class="bg-particle"></div><div class="bg-particle"></div>
  <div class="bg-particle"></div>
</div>

<div class="main-container">
  <div class="card" id="card">
    <div class="input-section" id="inputSection">
      <h2>🌸 请输入你的名字</h2>
                <p class="subtitle">看看今天有没有属于你的惊喜~</p>
      <div class="input-wrapper">
        <input type="text" id="nameInput" placeholder="在这里输入名字..." autocomplete="off" maxlength="30">
        <button class="btn-submit" id="submitBtn">✨ 确认</button>
      </div>
      <div class="error-message" id="errorMsg"></div>
    </div>

    <div class="rose-section" id="roseSection">
      <canvas id="roseCanvas" width="600" height="620"></canvas>
      <div class="blessing-text" id="blessingText">🌹 母亲节快乐~ 🌹</div>
      <button class="btn-back" id="btnBack">← 返回重新输入</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const inputSection = document.getElementById('inputSection');
    const roseSection = document.getElementById('roseSection');
    const nameInput = document.getElementById('nameInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const btnBack = document.getElementById('btnBack');
    const blessingText = document.getElementById('blessingText');
    const roseCanvas = document.getElementById('roseCanvas');
    const ctx = roseCanvas.getContext('2d');
    const card = document.getElementById('card');

    let animationId = null;
    let particles = [];
    let sparkles = [];
    let isRoseVisible = false;
    const canvasW = roseCanvas.width;
    const canvasH = roseCanvas.height;

    // ---------- 动画进度控制 ----------
    let animProgress = 0;            // 0 到 1
    let animTargetProgress = 0;
    let animStartTime = 0;
    const ANIM_DURATION = 3800;     // 总绘制时长(ms)
    let animationFrameReq = null;
    let hasFinishedDrawing = false;

    // ---------- 飘落花瓣粒子 ----------
    class PetalParticle {
      constructor(w, h) {
        this.w = w; this.h = h;
        this.reset(true);
      }
      reset(initial = false) {
        this.x = Math.random() * this.w;
        this.y = initial ? Math.random() * this.h : -40 - Math.random() * 60;
        this.size = 5 + Math.random() * 15;
        this.speedY = 0.35 + Math.random() * 1.8;
        this.speedX = (Math.random() - 0.5) * 1.0;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.03;
        this.opacity = 0.25 + Math.random() * 0.65;
        this.wobbleAmp = 0.3 + Math.random() * 1.4;
        this.wobbleFreq = 0.007 + Math.random() * 0.028;
        this.wobbleOffset = Math.random() * Math.PI * 2;
        this.color = this.randomColor();
      }
      randomColor() {
        const colors = ['#f9c5d5','#f7b8c8','#fcd5df','#f8ccd6','#fde0e7','#f4aebb','#fad2dc','#fbe4ea','#f7c0ce','#fcd8e2','#f3b5c4','#e8909f'];
        return colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.y * this.wobbleFreq + this.wobbleOffset) * this.wobbleAmp;
        this.rotation += this.rotSpeed;
        if (this.y > this.h + 50 || this.x < -60 || this.x > this.w + 60) {
          this.reset(false);
          this.y = -40 - Math.random() * 50;
        }
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-this.size*0.5, -this.size*0.3, -this.size*0.5, -this.size*0.75, 0, -this.size);
        ctx.bezierCurveTo(this.size*0.5, -this.size*0.75, this.size*0.5, -this.size*0.3, 0, 0);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class Sparkle {
      constructor(cx, cy, maxR) {
        this.cx = cx; this.cy = cy; this.maxR = maxR;
        this.reset();
      }
      reset() {
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * this.maxR;
        this.x = this.cx + Math.cos(angle) * dist;
        this.y = this.cy + Math.sin(angle) * dist;
        this.size = 0.5 + Math.random() * 2.4;
        this.opacity = 0;
        this.targetOpacity = 0.2 + Math.random() * 0.7;
        this.phase = Math.random() * Math.PI * 2;
        this.speed = 0.012 + Math.random() * 0.045;
      }
      update() {
        this.opacity += (this.targetOpacity - this.opacity) * 0.03;
        this.phase += this.speed;
        this.opacity = this.targetOpacity * (0.4 + 0.6 * Math.sin(this.phase));
        if (Math.random() < 0.004) this.targetOpacity = 0.2 + Math.random() * 0.7;
        if (Math.random() < 0.003) this.reset();
      }
      draw(ctx) {
        if (this.opacity < 0.03) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#fffef0';
        ctx.shadowColor = '#ffe8c0';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }

    // ---------- 带进度的玫瑰绘制 ----------
    function drawSingleRose(ctx, cx, cy, scale = 1.0, hueShift = 0, progress = 1.0) {
      if (progress <= 0) return;
      const baseColor1 = `hsl(${355 + hueShift}, 80%, 72%)`;
      const baseColor2 = `hsl(${352 + hueShift}, 75%, 55%)`;
      const baseColor3 = `hsl(${349 + hueShift}, 72%, 48%)`;
      const baseColor4 = `hsl(${346 + hueShift}, 70%, 38%)`;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      // 花茎 (进度: 0.0~0.12)
      const stemProgress = Math.min(1, Math.max(0, (progress - 0.0) / 0.12));
      if (stemProgress > 0) {
        const stemGrad = ctx.createLinearGradient(-2, 0, 2, 50);
        stemGrad.addColorStop(0, '#5a8a3c');
        stemGrad.addColorStop(0.5, '#4a7a2e');
        stemGrad.addColorStop(1, '#3d6b24');
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(-3, 10);
        ctx.lineTo(-2, 10 + (50 * stemProgress));
        ctx.quadraticCurveTo(0, 10 + (52 * stemProgress), 2, 10 + (50 * stemProgress));
        ctx.lineTo(3, 10);
        ctx.quadraticCurveTo(0, 8, -3, 10);
        ctx.clip();
        ctx.fillStyle = stemGrad;
        ctx.fill();
        ctx.restore();
      }

      // 叶子 (进度: 0.08~0.25)
      const leafProgress = Math.min(1, Math.max(0, (progress - 0.08) / 0.17));
      if (leafProgress > 0) {
        function leaf(lx, ly, angle, s = 1) {
          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(angle);
          ctx.scale(s, s);
          const lg = ctx.createLinearGradient(0, -12, 0, 12);
          lg.addColorStop(0, '#6daa44');
          lg.addColorStop(0.5, '#558a32');
          lg.addColorStop(1, '#3f7020');
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.bezierCurveTo(-7, -10*leafProgress, -9, -15*leafProgress, 0, -18*leafProgress);
          ctx.bezierCurveTo(9, -15*leafProgress, 7, -10*leafProgress, 0, 0);
          ctx.fillStyle = lg;
          ctx.fill();
          ctx.restore();
        }
        leaf(-5, 35, -0.6, 1.1);
        leaf(4, 28, 0.5, 0.95);
        leaf(3, 12, 0.8, 0.65);
      }

      // 花瓣绘制函数
      function petal(px, py, len, wid, angle, c1, c2, alpha = 1) {
        if (progress < 0.2) return;
        const petalProgress = Math.min(1, Math.max(0, (progress - 0.2) / 0.75));
        const currentLen = len * petalProgress;
        if (currentLen < 1) return;
        ctx.save();
        ctx.globalAlpha = alpha * (0.7 + 0.3 * petalProgress);
        ctx.translate(px, py);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(-wid * petalProgress, -currentLen*0.32, -wid*0.7*petalProgress, -currentLen*0.74, 0, -currentLen);
        ctx.bezierCurveTo(wid*0.7*petalProgress, -currentLen*0.74, wid*petalProgress, -currentLen*0.32, 0, 0);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, 0, 0, -currentLen);
        grad.addColorStop(0, c1);
        grad.addColorStop(0.55, c2);
        grad.addColorStop(1, c1);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,225,210,0.25)';
        ctx.lineWidth = 0.4;
        ctx.stroke();
        ctx.restore();
      }

      // 最外层花瓣
      for (let i=0; i<8; i++) {
        const a = -Math.PI/2 + (i/8)*Math.PI*2;
        petal(0,-2,52,20,a,baseColor1,baseColor2,0.88);
      }
      for (let i=0; i<8; i++) {
        const a = -Math.PI/2 + (i/8)*Math.PI*2 + Math.PI/8;
        petal(0,-1,43,17,a,baseColor1,baseColor2,0.9);
      }
      for (let i=0; i<7; i++) {
        const a = -Math.PI/2 + (i/7)*Math.PI*2 + 0.2;
        petal(0,0,33,13,a,baseColor2,baseColor3,0.93);
      }
      for (let i=0; i<6; i++) {
        const a = -Math.PI/2 + (i/6)*Math.PI*2 + 0.3;
        petal(0,0,22,9,a,baseColor3,baseColor4,0.95);
      }
      // 花心 (进度后期)
      if (progress > 0.55) {
        const coreProgress = Math.min(1, (progress - 0.55) / 0.45);
        const centerGrad = ctx.createRadialGradient(0, -1, 1, 0, 0, 9 * coreProgress);
        centerGrad.addColorStop(0, '#fde8d0');
        centerGrad.addColorStop(0.4, '#edb88a');
        centerGrad.addColorStop(0.75, '#b84050');
        centerGrad.addColorStop(1, '#8f2030');
        ctx.beginPath();
        ctx.arc(0, -1, 9 * coreProgress, 0, Math.PI*2);
        ctx.fillStyle = centerGrad;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBouquet(ctx, w, h, progress) {
      const cx = w/2;
      const cy = h*0.38;
      const bundleY = cy + 155;

      // 包装纸 (进度0.0~0.18)
      const paperProgress = Math.min(1, Math.max(0, progress / 0.18));
      if (paperProgress > 0) {
        ctx.save();
        ctx.globalAlpha = paperProgress;
        const paperLeftGrad = ctx.createLinearGradient(cx-80, bundleY-30, cx-20, bundleY+90);
        paperLeftGrad.addColorStop(0, 'rgba(240,220,210,0.55)');
        paperLeftGrad.addColorStop(0.5, 'rgba(245,225,215,0.7)');
        paperLeftGrad.addColorStop(1, 'rgba(230,200,180,0.45)');
        ctx.beginPath();
        ctx.moveTo(cx-15, bundleY-10);
        ctx.bezierCurveTo(cx-80, bundleY-50, cx-130, bundleY+30, cx-110, bundleY+85);
        ctx.lineTo(cx-15, bundleY+70);
        ctx.quadraticCurveTo(cx-10, bundleY+20, cx-15, bundleY-10);
        ctx.fillStyle = paperLeftGrad; ctx.fill();

        const paperRightGrad = ctx.createLinearGradient(cx+20, bundleY-30, cx+80, bundleY+90);
        paperRightGrad.addColorStop(0, 'rgba(240,218,208,0.55)');
        paperRightGrad.addColorStop(0.5, 'rgba(248,228,218,0.7)');
        paperRightGrad.addColorStop(1, 'rgba(228,198,178,0.45)');
        ctx.beginPath();
        ctx.moveTo(cx+15, bundleY-10);
        ctx.bezierCurveTo(cx+80, bundleY-50, cx+130, bundleY+30, cx+110, bundleY+85);
        ctx.lineTo(cx+15, bundleY+70);
        ctx.quadraticCurveTo(cx+10, bundleY+20, cx+15, bundleY-10);
        ctx.fillStyle = paperRightGrad; ctx.fill();

        const paperFrontGrad = ctx.createLinearGradient(cx, bundleY-20, cx, bundleY+75);
        paperFrontGrad.addColorStop(0, 'rgba(250,240,230,0.5)');
        paperFrontGrad.addColorStop(0.6, 'rgba(240,220,200,0.65)');
        paperFrontGrad.addColorStop(1, 'rgba(225,200,175,0.55)');
        ctx.beginPath();
        ctx.moveTo(cx-10, bundleY-8);
        ctx.bezierCurveTo(cx-55, bundleY-15, cx-75, bundleY+45, cx-50, bundleY+75);
        ctx.lineTo(cx+50, bundleY+75);
        ctx.bezierCurveTo(cx+75, bundleY+45, cx+55, bundleY-15, cx+10, bundleY-8);
        ctx.fillStyle = paperFrontGrad; ctx.fill();
        ctx.restore();
      }

      // 花茎 (进度0.12~0.30)
      const stemProgress = Math.min(1, Math.max(0, (progress - 0.12) / 0.18));
      const rosePositions = [
        {x: cx-22, y: cy-8, s:0.68, hue:2},
        {x: cx+24, y: cy-12, s:0.72, hue:-3},
        {x: cx-42, y: cy+5, s:0.6, hue:5},
        {x: cx+44, y: cy+2, s:0.58, hue:-5},
        {x: cx-2, y: cy-25, s:0.8, hue:0},
        {x: cx-28, y: cy-30, s:0.55, hue:8},
        {x: cx+30, y: cy-28, s:0.57, hue:-8},
      ];
      if (stemProgress > 0) {
        ctx.save();
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = '#3d6b24';
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(40,60,20,0.3)';
        ctx.shadowBlur = 6;
        for (const pos of rosePositions) {
          const endY = pos.y + 18*pos.s + (bundleY - (pos.y + 18*pos.s)) * stemProgress;
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y + 18*pos.s);
          ctx.lineTo(pos.x, endY);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // 玫瑰花 (进度0.25~1.0)
      for (const pos of rosePositions) {
        drawSingleRose(ctx, pos.x, pos.y, pos.s, pos.hue, Math.min(1, Math.max(0, (progress - 0.25) / 0.7)));
      }

      // 丝带蝴蝶结 (进度0.75~1.0)
      const bowProgress = Math.min(1, Math.max(0, (progress - 0.75) / 0.25));
      if (bowProgress > 0) {
        const bowX = cx;
        const bowY = bundleY - 4;
        ctx.save();
        ctx.globalAlpha = bowProgress;
        ctx.shadowColor = 'rgba(120,60,40,0.3)';
        ctx.shadowBlur = 8;
        const bowGrad1 = ctx.createLinearGradient(bowX-30, bowY, bowX, bowY);
        bowGrad1.addColorStop(0, '#e07080'); bowGrad1.addColorStop(1, '#c2414c');
        ctx.beginPath();
        ctx.ellipse(bowX-22, bowY-3, 24, 12, -0.2, 0, Math.PI*2);
        ctx.fillStyle = bowGrad1; ctx.fill();
        const bowGrad2 = ctx.createLinearGradient(bowX, bowY, bowX+30, bowY);
        bowGrad2.addColorStop(0, '#c2414c'); bowGrad2.addColorStop(1, '#e07080');
        ctx.beginPath();
        ctx.ellipse(bowX+22, bowY-3, 24, 12, 0.2, 0, Math.PI*2);
        ctx.fillStyle = bowGrad2; ctx.fill();
        const knotGrad = ctx.createRadialGradient(bowX, bowY-1, 2, bowX, bowY, 10);
        knotGrad.addColorStop(0, '#fce8e0'); knotGrad.addColorStop(0.7,'#d4687c'); knotGrad.addColorStop(1,'#a82d3d');
        ctx.beginPath();
        ctx.arc(bowX, bowY-1, 9, 0, Math.PI*2);
        ctx.fillStyle = knotGrad; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bowX-6, bowY+5);
        ctx.bezierCurveTo(bowX-18, bowY+30, bowX-35, bowY+45, bowX-44, bowY+65);
        ctx.lineTo(bowX-36, bowY+68);
        ctx.bezierCurveTo(bowX-24, bowY+48, bowX-10, bowY+30, bowX-1, bowY+12);
        ctx.closePath();
        ctx.fillStyle = '#c2414c'; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bowX+6, bowY+5);
        ctx.bezierCurveTo(bowX+18, bowY+30, bowX+35, bowY+45, bowX+44, bowY+65);
        ctx.lineTo(bowX+36, bowY+68);
        ctx.bezierCurveTo(bowX+24, bowY+48, bowX+10, bowY+30, bowX+1, bowY+12);
        ctx.closePath();
        ctx.fillStyle = '#d4687c'; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }

    function renderScene(progress) {
      ctx.clearRect(0, 0, canvasW, canvasH);
      const bgGrad = ctx.createRadialGradient(canvasW/2, canvasH*0.42, 40, canvasW/2, canvasH*0.42, 350);
      bgGrad.addColorStop(0, '#fffdf7');
      bgGrad.addColorStop(0.6, '#fef7f1');
      bgGrad.addColorStop(1, '#fef3eb');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvasW, canvasH);

      drawBouquet(ctx, canvasW, canvasH, progress);

      for (const p of particles) { p.update(); p.draw(ctx); }
      for (const s of sparkles) { s.update(); s.draw(ctx); }
    }

    // ---------- 动画循环 ----------
    function startDrawingAnimation() {
      animProgress = 0;
      animTargetProgress = 1;
      animStartTime = performance.now();
      hasFinishedDrawing = false;
      blessingText.classList.remove('visible');
      btnBack.classList.remove('show');

      function step(now) {
        if (!isRoseVisible) {
          animationFrameReq = null;
          return;
        }
        const elapsed = now - animStartTime;
        const rawProgress = Math.min(1, elapsed / ANIM_DURATION);
        // 轻微缓动
        animProgress = rawProgress < 0.5 ?
          2 * rawProgress * rawProgress :
          -1 + (4 - 2 * rawProgress) * rawProgress;

        renderScene(animProgress);

        if (animProgress >= 1.0) {
          if (!hasFinishedDrawing) {
            hasFinishedDrawing = true;
            blessingText.classList.add('visible');
            btnBack.classList.add('show');
          }
          // 继续循环以维持粒子动画
        }
        animationFrameReq = requestAnimationFrame(step);
      }
      animationFrameReq = requestAnimationFrame(step);
    }

    function stopAnimation() {
      if (animationFrameReq) {
        cancelAnimationFrame(animationFrameReq);
        animationFrameReq = null;
      }
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }

    function initParticles() {
      particles = [];
      sparkles = [];
      for (let i=0; i<35; i++) particles.push(new PetalParticle(canvasW, canvasH));
      for (let i=0; i<28; i++) sparkles.push(new Sparkle(canvasW/2, canvasH*0.4, 170));
    }

    function showRose() {
      isRoseVisible = true;
      inputSection.classList.add('fade-out');
      setTimeout(() => {
        inputSection.style.display = 'none';
        roseSection.classList.add('active');
        roseSection.style.display = 'flex';
        card.style.minHeight = '620px';
        initParticles();
        startDrawingAnimation();
      }, 420);
    }

    function showInput() {
      isRoseVisible = false;
      stopAnimation();
      roseSection.classList.remove('active');
      roseSection.style.display = 'none';
      inputSection.style.display = '';
      inputSection.classList.remove('fade-out');
      card.style.minHeight = '';
      nameInput.value = '';
      errorMsg.textContent = '';
      errorMsg.classList.remove('show');
      blessingText.classList.remove('visible');
      btnBack.classList.remove('show');
      nameInput.focus();
    }

    function showError() {
      errorMsg.innerHTML = '<span class="emoji">😜</span> 惊喜不是留给你的哦~';
      errorMsg.classList.add('show');
      nameInput.classList.add('shake');
      setTimeout(() => nameInput.classList.remove('shake'), 600);
      clearTimeout(errorMsg._timeout);
      errorMsg._timeout = setTimeout(() => errorMsg.classList.remove('show'), 3000);
    }

    function handleSubmit() {
      const name = nameInput.value.trim();
      if (name === '徐明芳') {
        errorMsg.classList.remove('show');
        clearTimeout(errorMsg._timeout);
        showRose();
      } else if (name === '') {
        errorMsg.innerHTML = '<span class="emoji">🤔</span> 请输入名字再确认哦~';
        errorMsg.classList.add('show');
        clearTimeout(errorMsg._timeout);
        errorMsg._timeout = setTimeout(() => errorMsg.classList.remove('show'), 2500);
      } else {
        showError();
      }
    }

    submitBtn.addEventListener('click', handleSubmit);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); handleSubmit(); }
    });
    btnBack.addEventListener('click', showInput);
    nameInput.focus();

    roseCanvas.addEventListener('click', (e) => {
      if (!isRoseVisible) return;
      const rect = roseCanvas.getBoundingClientRect();
      const scaleX = canvasW / rect.width;
      const scaleY = canvasH / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;
      for (let i=0; i<12; i++) {
        const p = new PetalParticle(canvasW, canvasH);
        p.x = cx + (Math.random()-0.5)*80;
        p.y = cy + (Math.random()-0.5)*60;
        p.speedY = 0.3 + Math.random()*2.2;
        p.speedX = (Math.random()-0.5)*2.8;
        particles.push(p);
      }
      while (particles.length > 60) particles.shift();
    });

    window.addEventListener('resize', () => {
      if (isRoseVisible) renderScene(animProgress);
    });
    console.log('🌹 绘制动画版玫瑰花束已准备就绪');
  })();
</script>
